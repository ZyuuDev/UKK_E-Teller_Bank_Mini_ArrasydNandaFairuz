name: Deploy E-Teller Bank Mini to DomaiNesia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip, curl, dom, simplexml, xmlreader, xmlwriter, libxml
          coverage: none

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          cp -n .env.example .env || true
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --ignore-platform-reqs

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🎨 Build Frontend React SPA
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..
          cp -r frontend/dist/* public/

      - name: 🚀 Sync Files via FTP to DomaiNesia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '202.155.137.35' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          timeout: 120000
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            frontend/node_modules/**
            frontend/src/**
            tests/**
            .env
            .env.example
            *.docx
            *.md
            *.xml
            *.csv
            phpunit.xml
            vite.config.js
            frontend/vite.config.js
            frontend/eslint.config.js
            frontend/tailwind.config.js
            frontend/postcss.config.js

      - name: ⚡ Trigger Database Migration & Cache Optimization
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          TOKEN="${DEPLOY_SECRET:-skansaba_super_secret_token_12345}"
          echo "Menjalankan sinkronisasi database & optimasi di server live..."
          curl -sS -k "https://skansaba-bankmini.web.id/api/deploy-migrate-${TOKEN}" || echo "Catatan: Webhook diproses secara async."

