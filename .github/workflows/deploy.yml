name: Deploy E-Teller Bank Mini to DomaiNesia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip, curl
          coverage: none

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🎨 Build Frontend React SPA
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          cp -r frontend/dist/* public/

      - name: 🚀 Sync Files via FTP to DomaiNesia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            frontend/node_modules/**
            frontend/src/**
            tests/**
            .env
            .env.example
            *.docx
            *.md
            *.xml
            *.csv
            phpunit.xml
            vite.config.js
            frontend/vite.config.js
            frontend/eslint.config.js
            frontend/tailwind.config.js
            frontend/postcss.config.js

      - name: ⚡ Trigger Database Migration & Cache Optimization
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -n "$DEPLOY_SECRET" ]; then
            echo "Menjalankan webhook migrasi & optimasi di server live..."
            curl -sS -k -f "https://skansaba-bankmini.web.id/deploy-migrate-${DEPLOY_SECRET}" || echo "Catatan: Webhook belum dapat diakses jika DNS domain belum selesai propagasi."
          else
            echo "DEPLOY_SECRET tidak diset, melewati webhook migrasi."
          fi

